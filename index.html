      // Фон игрушки применяется сразу, чтобы страница не мигала тёмным до загрузки данных (технические страницы остаются тёмными).

        if (!/^#\/(editor|tech|sheet)/.test(location.hash)) {
          var saved = JSON.parse(localStorage.getItem('crocodile-mario:settings:v1') || '{}');

    <script>
      // Начальный вид игрушки известен до загрузки данных. Статическая разметка — закрытая выключенная игрушка (так страница открывается обычно);
      // `?view=full|screen` и `?power=on` (как в parseView и startApp) переключают её здесь же, до первой отрисовки, — без промежуточного вида.
      (function () {
        try {
          var q = new URLSearchParams(location.search);
          var on = q.get('power') === 'on';
          var v = q.get('view');
          if (v !== 'closed' && v !== 'full' && v !== 'screen') v = 'closed';
          if (on && v === 'closed') v = 'full';
          var parts = [document.getElementById('arena'), document.getElementById('toy')];
          for (var i = 0; i < parts.length; i++) {
            parts[i].dataset.view = v;
            if (v !== 'closed') parts[i].removeAttribute('data-closed');
            if (v === 'screen') parts[i].setAttribute('data-compact', '');
          }
          parts[1].dataset.power = on ? 'on' : 'off';
        } catch (e) {}
      })();
    </script>
    <script type="module" src="/src/main.ts"></script>
