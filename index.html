<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Crocodile Mario — браузерная версия электронной игрушки: кнопки, экран, светодиоды." />
    <link rel="icon" href="data:," />
    <title>Crocodile Mario</title>
  </head>
  <body data-chrome="toy">
    <main class="shell">
      <h1 class="visually-hidden">Crocodile Mario</h1>
      <nav class="corner" id="corner" aria-label="Сервис">
        <button type="button" class="corner__btn" id="corner-settings" title="Настройки" aria-label="Настройки">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 8.6a3.4 3.4 0 1 0 0 6.8 3.4 3.4 0 0 0 0-6.8Zm8.2 4.4-.1-2 1.9-1.4-1.8-3.2-2.2.8a7.6 7.6 0 0 0-1.7-1l-.4-2.3h-3.6l-.4 2.3a7.6 7.6 0 0 0-1.7 1l-2.2-.8-1.8 3.2L6 11l-.1 2 .1 0-1.9 1.5 1.8 3.2 2.2-.9c.5.4 1.1.7 1.7 1l.4 2.3h3.6l.4-2.3c.6-.3 1.2-.6 1.7-1l2.2.9 1.8-3.2-1.9-1.5Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
        </button>
        <button type="button" class="corner__btn" id="corner-help" title="Справка" aria-label="Справка">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.4 9.4a2.7 2.7 0 1 1 3.9 2.4c-.9.5-1.3 1-1.3 2.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.1" fill="currentColor"/></svg>
        </button>
        <button type="button" class="corner__btn" id="corner-compact" title="Только экран" aria-label="Только экран" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><rect x="8.2" y="9" width="7.6" height="6" rx="1" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>
        </button>
        <a class="corner__btn" id="corner-editor" href="#/editor" title="Редактор уровней" aria-label="Редактор уровней">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 20l1-4.2L16.4 4.4a1.8 1.8 0 0 1 2.5 0l.7.7a1.8 1.8 0 0 1 0 2.5L8.2 19 4 20Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M14.5 6.3l3.2 3.2" stroke="currentColor" stroke-width="1.6"/></svg>
        </a>
      </nav>

      <header class="shell__header" id="tech-header">
        <span class="badge" id="badge" role="note"></span>
        <p class="shell__sub" id="subtitle"></p>
      </header>

      <section class="stage" id="stage" aria-label="Игрушка Crocodile Mario">
        <p class="visually-hidden" id="sr-status" role="status"></p>
        <div class="toy" id="toy" data-shell="blue" data-power="on">
        <div class="lid" id="lid">
          <div class="lid__face">
            <i class="lid__screw lid__screw--tl" aria-hidden="true"></i>
            <i class="lid__screw lid__screw--tr" aria-hidden="true"></i>
            <i class="lid__screw lid__screw--bl" aria-hidden="true"></i>
            <i class="lid__screw lid__screw--br" aria-hidden="true"></i>
            <div class="lid__leds" aria-hidden="true">
              <i class="led led--red"></i><i class="led led--yellow"></i><i class="led led--green"></i>
            </div>
            <div class="lid__bezel">
              <div class="lid__window" id="lcd-window">
                <div
                  class="game-area"
                  id="game-area"
                  tabindex="0"
                  role="application"
                  aria-label="Экран игры"
                >
                  <canvas id="screen" aria-hidden="true"></canvas>
                  <div class="overlay" id="overlay" hidden>
                    <p class="overlay__title" id="overlay-title"></p>
                    <p class="overlay__hint" id="overlay-hint"></p>
                    <button type="button" class="btn btn--primary" id="overlay-action"></button>
                  </div>
                  <p class="focus-hint" id="focus-hint" hidden>Кликните по игре, чтобы управлять с клавиатуры</p>
                </div>
              </div>
            </div>
            <svg class="lid__art" viewBox="0 0 640 140" aria-hidden="true" focusable="false">
              <defs>
                <g id="art-figure" fill="none" stroke-linejoin="round" stroke-linecap="round">
            <polygon points="20,6 22,5.4 27,5.4 29,7 31,8 32,10 34,11 33.7,13 31,13.6 30,18 27.2,21 24.2,22.3 21,20.4 18.8,18 18.5,13.4 17.2,12.6 17.2,9.7 19,7.5" />
            <polygon points="17.4,25.5 19.2,24.2 21.2,25 25.7,25 28.4,24.2 30.7,25.7 31.7,28.4 30,31.3 25.7,35.1 23.5,35.2 19.1,32.1 16.7,29.2" />
            <polygon points="4.1,22.8 5.7,23.2 7.1,24.4 9.8,25.5 8.1,27 6.4,27.1 4.6,28 4.2,25.8" />
            <polygon points="38.6,25.2 40.6,24.9 42.2,23.9 44,24.5 44.5,27 42.5,28.1 40.7,27.6 38.1,27.9 37.7,26.4" />
            <polygon points="7.1,36.1 9,36.1 10.4,38.1 13.5,39.3 15.4,38.4 18,35.9 20.3,36.8 18.2,40 15.9,42 12.2,42.4 9.3,41.5 7.1,39.2 6.4,37.3" />
            <polygon points="28.7,36.4 30.5,36.4 32.1,38.6 34.9,39.8 37.3,38.5 40.4,38.1 40,40.1 37.2,42 34.6,42.4 31.9,40.8 29.4,38.7" />
                </g>
              </defs>
              <use href="#art-figure" transform="translate(16 14) scale(1.7)" />
              <use href="#art-figure" transform="translate(203 0) scale(1.7)" />
              <use href="#art-figure" transform="translate(456 2) scale(1.7)" />
              <g class="lid__mountain" fill="none" stroke-linecap="round" stroke-linejoin="round">
                <path d="M2 134 L90 118 L180 106 L270 92 L350 66 L388 50 L412 58 L450 66 L520 96 L590 118 L638 134 Z" />
                <path d="M150 124 L260 106 L330 94" />
                <path d="M240 129 L330 113 L380 78" />
                <path d="M388 52 L394 84 L420 104" />
                <path d="M440 82 L470 98 L520 112" />
              </g>
            </svg>
          </div>
        </div>

        <div class="toy__hinge" aria-hidden="true"><i class="toy__knuckle"></i><i class="toy__band"></i><i class="toy__knuckle"></i></div>

        <div class="base" id="base" role="group" aria-label="Кнопки игрушки">
      <svg class="base__art" viewBox="0 0 400 530" aria-hidden="true" focusable="false">
        <defs>
          <radialGradient id="dish" cx="50%" cy="45%" r="55%">
            <stop offset="0" stop-color="#000" stop-opacity="0"/>
            <stop offset="0.82" stop-color="#000" stop-opacity="0.05"/>
            <stop offset="1" stop-color="#000" stop-opacity="0.16"/>
          </radialGradient>
          <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#000" stop-opacity="0.2"/>
            <stop offset="0.12" stop-color="#000" stop-opacity="0.07"/>
            <stop offset="1" stop-color="#000" stop-opacity="0.1"/>
          </linearGradient>
        </defs>
        <path id="arc-onoff" d="M37 52 Q68 34 99 52" fill="none"/><text class="base__label"><textPath href="#arc-onoff" startOffset="50%" text-anchor="middle">ON/OFF</textPath></text>
        <path id="arc-sp" d="M121 52 Q152 34 183 52" fill="none"/><text class="base__label"><textPath href="#arc-sp" startOffset="50%" text-anchor="middle">S./P.</textPath></text>
        <path id="arc-sound" d="M209 52 Q240 34 271 52" fill="none"/><text class="base__label"><textPath href="#arc-sound" startOffset="50%" text-anchor="middle">SOUND</textPath></text>
        <path id="arc-fire" d="M293 52 Q324 34 355 52" fill="none"/><text class="base__label"><textPath href="#arc-fire" startOffset="50%" text-anchor="middle">FIRE</textPath></text>
        <circle class="base__led" cx="60" cy="128" r="2.4"/>
        <text class="base__label" x="110" y="143" text-anchor="middle">UP</text>
        <text class="base__label" x="28" y="218" text-anchor="middle" dominant-baseline="middle" transform="rotate(-90 28 218)">LEFT</text>
        <text class="base__label" x="192" y="218" text-anchor="middle" dominant-baseline="middle" transform="rotate(90 192 218)">RIGHT</text>
        <text class="base__label" x="110" y="306" text-anchor="middle">DOWN</text>
        <text class="base__label" x="292" y="146" text-anchor="middle">JUMP</text>
        <circle cx="110" cy="218" r="98" fill="url(#dish)"/>
        <g class="base__speaker">

        <circle cx="119.0" cy="363" r="2.9"/>

        <circle cx="299.0" cy="363" r="2.9"/>
        </g>
        <path class="base__cover" d="M0 384 Q200 408 400 384 L400 530 L0 530 Z" fill="url(#cover)"/>
        <path class="base__seam" d="M0 384 Q200 408 400 384" fill="none"/>
      </svg>
      <button type="button" class="key key--round" data-key="onoff" tabindex="-1" aria-label="ON/OFF — включить или выключить" style="--x:68;--y:74;--w:36"></button>
      <button type="button" class="key key--round" data-key="sp" tabindex="-1" aria-label="S./P. — старт и пауза" style="--x:152;--y:74;--w:36"></button>
      <button type="button" class="key key--round" data-key="sound" tabindex="-1" aria-label="SOUND — звук" style="--x:240;--y:74;--w:36"></button>
      <button type="button" class="key key--round" data-key="fire" tabindex="-1" aria-label="FIRE — огонь" style="--x:324;--y:74;--w:36"></button>

      <button type="button" class="key key--pad key--up" data-key="up" tabindex="-1" aria-label="UP — вверх" style="--x:110;--y:170;--w:40">
        <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path class="key__shape" d="M20 4 36 18v16H4V18Z"/><circle class="key__dish" cx="20" cy="22" r="8.5"/></svg>
      </button>
      <button type="button" class="key key--pad" data-key="left" tabindex="-1" aria-label="LEFT — влево" style="--x:62;--y:218;--w:40">
        <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path class="key__shape" d="M20 3 37 20 20 37 3 20Z"/><circle class="key__dish" cx="20" cy="20" r="8.5"/></svg>
      </button>
      <button type="button" class="key key--pad" data-key="right" tabindex="-1" aria-label="RIGHT — вправо" style="--x:158;--y:218;--w:40">
        <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path class="key__shape" d="M20 3 37 20 20 37 3 20Z"/><circle class="key__dish" cx="20" cy="20" r="8.5"/></svg>
      </button>
      <button type="button" class="key key--pad" data-key="down" tabindex="-1" aria-label="DOWN — вниз" style="--x:110;--y:266;--w:40">
        <svg viewBox="0 0 40 40" aria-hidden="true" focusable="false"><path class="key__shape" d="M20 3 37 20 20 37 3 20Z"/><circle class="key__dish" cx="20" cy="20" r="8.5"/></svg>
      </button>

      <button type="button" class="key key--jump" data-key="jump" tabindex="-1" aria-label="JUMP — прыжок" style="--x:292;--y:198;--w:80">
        <svg viewBox="0 0 80 80" aria-hidden="true" focusable="false">
          <circle class="key__cap" cx="40" cy="40" r="38"/>
          <g class="key__ring">
          <circle cx="71.0" cy="40.0" r="1.9"/>
          <circle cx="69.1" cy="50.6" r="1.9"/>
          <circle cx="63.7" cy="59.9" r="1.9"/>
          <circle cx="55.5" cy="66.8" r="1.9"/>
          <circle cx="45.4" cy="70.5" r="1.9"/>
          <circle cx="34.6" cy="70.5" r="1.9"/>
          <circle cx="24.5" cy="66.8" r="1.9"/>
          <circle cx="16.3" cy="59.9" r="1.9"/>
          <circle cx="10.9" cy="50.6" r="1.9"/>
          <circle cx="9.0" cy="40.0" r="1.9"/>
          <circle cx="10.9" cy="29.4" r="1.9"/>
          <circle cx="16.3" cy="20.1" r="1.9"/>
          <circle cx="24.5" cy="13.2" r="1.9"/>
          <circle cx="34.6" cy="9.5" r="1.9"/>
          <circle cx="45.4" cy="9.5" r="1.9"/>
          <circle cx="55.5" cy="13.2" r="1.9"/>
          <circle cx="63.7" cy="20.1" r="1.9"/>
          <circle cx="69.1" cy="29.4" r="1.9"/>
          </g>
          <circle class="key__dish" cx="40" cy="40" r="19"/>
        </svg>
      </button>

      <img class="base__logo base__logo--color" src="/brand/crocodile-mario-logo.png" width="1000" height="443" alt="Crocodile Mario" />
      <img class="base__logo base__logo--white" src="/brand/crocodile-mario-logo-white.png" width="1000" height="443" alt="" aria-hidden="true" />
        </div>
        </div>
      </section>

      <div class="toolbar" role="toolbar" aria-label="Управление игрой">
        <button type="button" class="btn" id="btn-pause">Пауза</button>
        <button type="button" class="btn" id="btn-restart">Рестарт</button>
        <button type="button" class="btn" id="btn-settings">Настройки…</button>
        <label class="toolbar__check" id="shell-toggle" hidden>
          Корпус
          <select id="sel-shell">
            <option value="blue">синий</option>
            <option value="red">красный</option>
            <option value="white">белый</option>
          </select>
        </label>
        <label class="toolbar__check" id="ghost-toggle" hidden>
          <input type="checkbox" id="chk-ghost" /> Неактивные сегменты
        </label>
        <label class="toolbar__check" id="sound-toggle">
          <input type="checkbox" id="chk-sound" /> Звук
        </label>
        <label class="toolbar__check" id="debug-toggle"><input type="checkbox" id="chk-debug" /> Отладка</label>
      </div>

      <section class="status" aria-live="polite" aria-label="Состояние ввода">
        <p><strong>Клавиатура:</strong> <span id="status-keyboard"></span></p>
        <p><strong>Геймпад:</strong> <span id="status-gamepad"></span></p>
        <p id="row-timer"><strong>Таймер участка (demo):</strong> <span id="status-timer"></span></p>
        <p class="status__hint" id="controls-hint"></p>
        <p class="status__warn" id="status-warning" hidden></p>
        <p class="status__content" id="status-content"></p>
      </section>

      <aside class="debug" id="debug" hidden aria-label="Отладочная панель">
        <h2>Отладка</h2>
        <pre id="debug-text"></pre>
        <div class="debug__row">
          <label><input type="checkbox" id="chk-grid" /> Сетка</label>
          <label><input type="checkbox" id="chk-collisions" /> Коллизии</label>
          <button type="button" class="btn" id="btn-step">Шаг (1 такт, на паузе)</button>
          <button type="button" class="btn" id="btn-debug-restart">Перезапуск демо</button>
        </div>
      </aside>

      <p class="shell__footer"><a id="route-link" href="#/">Однокомнатное демо</a></p>

      <section class="sheet" id="sheet" hidden aria-label="Контрольный лист ресурсов"></section>

      <section class="fatal" id="fatal" role="alert" hidden>
        <h2>Не удалось запустить игру</h2>
        <pre id="fatal-text"></pre>
      </section>
    </main>

    <div class="editor" id="editor-root" hidden></div>

    <dialog class="settings" id="settings"></dialog>
    <dialog class="settings help" id="help"></dialog>
    <noscript>Для игры нужен JavaScript.</noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
