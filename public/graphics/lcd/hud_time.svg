<svg xmlns="http://www.w3.org/2000/svg" width="160" height="100" viewBox="0 0 160 100">
  <!-- Слово TIME для таймера на HUD: тонкие штрихи (≈ 7 из 100 по высоте), высокие узкие буквы, тесно — по фотографии экрана оригинала (на кадре видно слово «TIME» тонкой гарнитурой, цифры жирнее). Цвет — currentColor (цвет «чернил» профиля экрана). Контуры приблизительные, не извлечённый оригинальный ресурс. -->
  <g fill="currentColor">
    <!-- T -->
    <rect x="0" y="0" width="44" height="7"/>
    <rect x="20.5" y="0" width="7" height="100"/>
    <!-- I -->
    <rect x="56.5" y="0" width="7" height="100"/>
    <!-- M -->
    <rect x="73" y="0" width="7" height="100"/>
    <rect x="122" y="0" width="7" height="100"/>
    <polygon points="73,0 80,0 101,52 122,0 129,0 129,12 101,70 73,12"/>
    <!-- E -->
    <rect x="135" y="0" width="7" height="100"/>
    <rect x="135" y="0" width="25" height="7"/>
    <rect x="135" y="46.5" width="21" height="7"/>
    <rect x="135" y="93" width="25" height="7"/>
  </g>
</svg>
