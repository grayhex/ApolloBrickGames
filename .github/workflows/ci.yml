name: CI

# Cloudflare independently builds/deploys main after merge.
# Run expensive validation on PRs, not again for each push or merge.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - name: Проверка Worker и привязок Cloudflare
        run: npm run check:worker
        env:
          WRANGLER_SEND_METRICS: 'false'

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Установка Chromium и системных зависимостей
        timeout-minutes: 15
        run: npx playwright install --with-deps --only-shell chromium
      - name: Браузерный smoke-тест
        timeout-minutes: 20
        run: npm run test:smoke -- --shard=${{ matrix.shard }}/2
